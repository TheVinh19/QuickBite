server.port=${SERVER_PORT:8086}
spring.application.name=cart-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:quickbite-db}:${DB_PORT:5432}/${DB_NAME:quickbite_cart_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}

spring.jpa.hibernate.ddl-auto=update
